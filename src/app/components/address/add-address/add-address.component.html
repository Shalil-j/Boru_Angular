<app-previous-tab-navbar></app-previous-tab-navbar>

  <!--  -->
  <div id="step-1" class="bg-white"  *ngIf="!steponeform">
    <div class="step-1-map">
      <iframe
        class="w-100 h-100"
        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15085.3191526296!2d72.86336325!3d19.049232500000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1670271383490!5m2!1sen!2sin"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
    <div class="h-25">
      <p class="text-center my-3 text-xs">
        To change location drag pin to your location
      </p>
      <div class="d-md-flex w-100 justify-content-between container pb-5">
        <div>
          <p>497 Evergreen Rd. Roseville, 497 Evergreen Rd. Rosevil</p>
          <p>CA 95673</p>
        </div>
        <div>
          <button class="btn btn-primary btn-lg w-100 my-3" (click)="stepTwo()">
            Confirm & Next
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- step 1 -->
  <div id="step-2" class="row g-0 bg-white" *ngIf="!steptowform">
    <!--  -->
    <div class="col-12 col-md-8">
      <iframe
      class="w-100 h-100"
        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15085.3191526296!2d72.86336325!3d19.049232500000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1670271383490!5m2!1sen!2sin"
        style="border: 0;min-height: 15rem;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
    <!--  -->
    <div class="col-12 col-md-4 p-3 p-lg-5">
      <p>Enter Address Details</p>
      <div class="border my-3 p-3 rounded border-primary">
      <p class="d-inline-block">
      <span class="  text-trunk" style="--text-trunk-line:2">497 Evergreen Rd. Roseville, 497 Evergreen Rd. Rosevil
        CA 95673 Evergreen Rd. Evergreen</span>
        <a class="text-decoration-none" href="" (click)="stepOne()">change</a></p>
      </div>
        <div class="mt-5">
          <input type="text" class="py-3 p-3 form-control focus-input " placeholder="House no. / Flat no. / Building *">
          <input type="text" class="py-3 p-3 form-control focus-input mt-3" placeholder="Floor (Optional) ">
          <input type="text" class="py-3 p-3 form-control focus-input mt-3" placeholder="How to reach (Optional)">

          <div class="mt-4">
            <p>Tag this location *</p>
            <div class="address-form d-flex align-items-center  gap-3 my-3 mb-lg-5">
              <div>
                <input type="radio" class="btn-check location-btn" name="location-type" id="home" checked>
                <label class="rounded px-4 py-2" for="home">Home</label>
              </div>
              <div>
                <input type="radio" class="btn-check location-btn" name="location-type" id="office">
                <label class="rounded px-4 py-2 " for="office">Office</label>
              </div>
              <div>
                <input type="radio" class="btn-check location-btn" name="location-type" id="other">
                <label class="rounded px-4 py-2" for="other">Other</label>
            </div>
          </div>
          </div>

          <button class="btn btn-lg btn-primary w-100 mt-5">Conform</button>

        </div>
      </div>
  </div>

  <!-- step 2 -->
<app-footer></app-footer>
<app-mobile-menu></app-mobile-menu>
