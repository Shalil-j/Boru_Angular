<div>
  <div class="d-flex justify-content-end w-100 my-3">
  <a class="btn btn-outline-primary" routerLink="/add-address"><i class="bi bi-plus-lg"></i> Add</a>
</div>
  <div class="row g-5  py-3 border-bottom" *ngFor="let items of address">
    <div class="col-1 " *ngIf="items.locations_type == 'office'">
      <img class="md-icon" src="../../../../assets/asserts/icons and vectors/Office location.svg" alt="">
    </div>
    <!--  -->
    <div class="col-1 " *ngIf="items.locations_type == 'other'">
      <img class="md-icon" src="../../../../assets/asserts/icons and vectors/Other location.svg" alt="">
    </div>
    <!--  -->
  <div class="col-1 " *ngIf="items.locations_type == 'home'">
    <img class="md-icon" src="../../../../assets/asserts/icons and vectors/Home customer.svg" alt="">
  </div>
  <!--  -->
  <div class="col-11 ">
  <div class="row align-items-center">
    <div class="col-10">
      <p class="fs-5 fw-semibold text-capitalize">{{items.locations_type}}</p>
      <p class="mt-2" >{{items.place_address}}</p>
      <p class="text-truncate">{{items.full_address}}</p>
    </div>
    <div class="col-2">
      <a class="text-decoration-none  text-primary" href="">Edit</a><br>
      <a class="text-decoration-none  text-primary" href="">Delete</a>
    </div>
  </div>
</div>
</div>

</div>
