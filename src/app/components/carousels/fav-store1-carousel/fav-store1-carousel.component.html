<div class="p-3 p-md-5 bg-white my-2">
  <p class="mb-2">Your Favourite Store</p>
  <owl-carousel-o [options]="customOptions" >
    <ng-template carouselSlide *ngFor="let items of fav_store">
      <a href="" class="page-link">
      <div class="store-div d-flex align-items-center p-2 rounded">
        <div class="store-logo">
          <img
            src="{{items.store_img}}"
            alt=""
          />
        </div>
        <div class="ms-3">
          <p class="fw-semibold">{{items.store_name}}</p>
          <p class="text-xs">{{items.store_add}}</p>
        </div>
      </div>
    </a>
    </ng-template>
  </owl-carousel-o>
  </div>
