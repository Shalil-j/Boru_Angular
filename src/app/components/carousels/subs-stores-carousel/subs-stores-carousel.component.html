<div class="bg-white p-3 my-2">
<p class="mb-2">Subscribed stores</p>
  <owl-carousel-o [options]="Fav_store" >
    <ng-template carouselSlide *ngFor="let items of fav_store">
      <a href="" class="page-link">
      <div class="fav-store-div  text-cente  d-flex flex-column align-items-center">
        <div class="fav-store-img d-flex justify-content-center align-items-center">
          <img class="rounded-circle" src="{{items.store_img}}" alt="">
        </div>
        <span class="d-inline-block text-truncate">{{items.store_name}}</span>
      </div>
    </a>
    </ng-template>
  </owl-carousel-o>
</div>
