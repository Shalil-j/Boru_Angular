<div class="bg-white" *ngIf="bannerDetailData">
<owl-carousel-o [options]="customOptions" >
  <ng-template carouselSlide *ngFor="let items of bannerDetailData">
    <div class="category-div rounded d-flex align-items-center justify-content-center">
    <a class="page-link fw-semibold text-center" routerLink="/store/{{items.vendor_id}}">
      <img src="{{items.profile_pic}}" alt="{{items.shop_name}}" />
      <p class="mt-2">{{items.shop_name}}</p>
    </a>
  </div>
  </ng-template>
</owl-carousel-o>
</div>
