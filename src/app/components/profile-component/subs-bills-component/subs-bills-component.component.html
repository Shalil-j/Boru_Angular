<div id="subscription-bill">
  <div class="subscription-bill-nav d-flex  justify-content-center">
      <div class="btn-group w-100" role="group" aria-label="Basic outlined example">
          <button type="button" class="btn btn-outline-secondary rounded-0 active">All</button>
          <button type="button" class="btn btn-outline-secondary rounded-0">New</button>
          <button type="button" class="btn btn-outline-secondary rounded-0">Unpaid</button>
        </div>
  </div>
  <div class="mt-3">
      <p class="subscription-bill-month text-secondary">August</p>
      <!--  -->
      <div class="bill py-3 border-bottom" *ngFor="let items of bills">
          <p class="shop-name fs-5 text-capitalize">{{items.shop_name}}</p>
          <div class="d-flex justify-content-between align-items-end mt-3">
              <div>
                  <p class="text-capitalize">{{items.month_of_purches}}</p>
                  <p class="text-xs fw-light mt-1 ">{{items.date_of_purches}}</p>
                  <p class="fw-semibold mt-2">Qty : <span>{{items.quantity}}</span></p>
              </div>
              <div>
                  <p id="bill-status" class="badge text-capitalize " [ngClass]="{ 'text-bg-success': items.status === 'paid' ,'text-bg-danger':items.status === 'un-paid','text-bg-primary':items.status === 'new' }">{{items.status}}</p>
                  <p class="fw-semibold">Amount : ₹ <span>{{items.amount}}</span></p>
              </div>
          </div>
      </div>
      <!--  -->
  </div>
</div>
