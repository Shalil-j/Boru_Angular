<div class="mt-5 mx-auto bg-white mt-2">
  <!--  -->
  <div class="p-3 border-bottom" *ngFor="let items of product_list">
  <div class="row  align-items-center ">
      <div class="col-12 col-lg-5">
      <div class="d-flex">
        <div>
        <div class="product-img">
          <img src="{{items.product_img}}" alt="">
        </div></div>
        <div class="w-100 ms-3">
          <div class="d-flex justify-content-between align-items-center w-100">
            <p class="fs-5 text-capitalize d-inline-block text-truncate">{{items.product_name}}</p>
            <button class="border-0 bg-transparent text-secondary d-md-none"><i class="bi bi-x-circle fs-4"></i></button>
          </div>
          <p class="fw-light">{{items.product_quantity}} {{items.measure_unit}} X <span>Qty : {{items.qty}}</span></p>
          <div class="d-flex pt-3 justify-content-between align-items-center w-100">
            <p class="">Dish Washer</p>
            <p class="d-md-none">Add : <span>Home</span></p>
          </div>
        </div>
      </div>
      </div>
      <!--  -->
      <div class="mt-3 d-flex justify-content-center py-2 d-md-none " *ngIf="items.subs_state == 'pause'">
        <p class="text-bg-light px-5 text-secondary">Paused from 11.12.2021 to 28.12.2021.</p>
      </div>
      <!--  -->
<div class="col-2 text-center d-none d-md-block">
  <p>Add : <span>Home</span></p>
</div>
      <!--  -->
      <div class="col-md-5  pt-3 pt-md-0" >
        <div class="row justify-content-between  align-item-center ">
          <div class="col-6 col-md-5 text-center">
            <a  class="fs-5 page-link text-primary "  href="product">
              <i class="bi bi-pencil-fill me-1"></i> Edit
            </a>
          </div>
          <div class="col-6 col-md-5 text-center">
            <a class="fs-5 page-link text-primary "><i class="bi bi-play-fill"></i> Resume</a>
          </div>
          <div class="d-none col-md-2 d-md-block">
            <button class="border-0 bg-transparent text-secondary"><i class="bi bi-x-circle fs-4"></i></button>
          </div>
        </div>
      </div>
  </div>
  <!--  -->
  <div class="mt-3 d-md-flex justify-content-center d-none" *ngIf="items.subs_state == 'pause'">
    <p class="text-bg-light px-5 text-secondary">Paused from 11.12.2021 to 28.12.2021.</p>
  </div>
</div>
  <!--  -->
</div>
