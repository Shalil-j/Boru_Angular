<div class="py-5">

  <div class=" col-md-10 mx-auto ">

    <div class="bill border-bottom  p-3" *ngFor="let bills of bill">
    <h5><span>{{bills.month}}</span> <span></span></h5>
    <div class="d-flex mt-1">
      <div class="col-4">
        <p>{{bills.date}}</p>
      </div>
      <div class="col-4 d-flex gap-3">
        <p>QTY : <span>{{bills.qty}}</span></p>
        <p>Amount : ₹ <span>{{bills.amount}}</span></p>
      </div>
      <div class="col-4 text-end">
          <p class="text-capitalize" [ngClass]="{'text-orange':bills.status == 'unpaid'}">{{bills.status}}</p>
      </div>
    </div>
  </div>


  </div>

</div>
