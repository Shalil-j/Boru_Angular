  <!-- products -->
  <div class="container pt-md-5 position-relative products-div">
    <div class="row">
      <div class="col-3 d-none d-md-inline-block">
        <!-- product menu for web -->
        <ul class="list-group product-menu">
          <li class="list-item"><a class=" page-link active" href="">All</a></li>
          <div *ngFor="let menu_items of product_service_available">
          <li class="list-item text-capitalize"><a class=" page-link" href="">{{menu_items}}</a></li>
        </div>
        </ul>
        <!-- product menu for web -->
      </div>
        <!-- product menu for mobile -->
        <div class="col-12 bg-light d-md-none">
          <div class="product-menu-mobile ">
            <div class="d-flex align-items-center gap-4 py-2">
              <button class="bg-transparent text-nowrap active-mobile-menu">All</button>
              <div class="d-flex align-items-center gap-4 py-2" *ngFor="let menu_items of product_service_available">
              <button class="bg-transparent text-nowrap text-capitalize">{{menu_items}}</button>
            </div>
          </div>
          </div>
        </div>
        <!-- product menu for mobile -->
      <div class="col-12 col-md-8 p-0 px-md-5 ">
        <!-- search box -->
        <div class="input-group px-2 my-3 border rounded-3 bg-light d-md-none">
          <input type="text" class="form-control bg-transparent border-0" placeholder="Search Product from Shubham Store, sector-14... " aria-label="Recipient's username" aria-describedby="basic-addon2">
          <span class="input-group-text bg-transparent border-0" id="basic-addon2"><i class="bi bi-search text-secondary fs-5"></i></span>
        </div>
       <!--  -->
       <div class="product p-3 border-bottom bg-white" *ngFor="let items of product_list ">
        <div class="d-flex ">
          <div class="product-img">
            <img class="img-contain" src="{{items.product_img}}" alt="">
          </div>
          <div class="product-detail w-100 ms-4 d-flex flex-column justify-content-between">
              <div>
                <h4 class="text-capitalize">{{items.product_name}}</h4>
                <p class="fw-light text-xs">(<span>{{items.product_quantity}}</span> <span>{{items.measure_unit}}</span>)</p>
              </div>
              <div class="d-flex justify-content-between align-items-center w-100">
                <div class=" fs-5">₹ <span>{{items.product_price}}</span></div>
                <div class="d-flex">
                  <div  id="quantity-btn" class="btn-group product-quantity d-none " role="group" aria-label="Basic example">
                    <button type="button" (click)="minus()" class=" text-center fw-bold rounded-start">-</button>
                    <input type="number" name="quantity" id="quantity" class="text-center border-0 " min="1" value="1" [(ngModel)]="quantity">
                    <button type="button" (click)="plus()" class="text-center fw-bold rounded-end quantity-plus">+</button>
                  </div>
                  <div class="ms-3 ">
                    <input  type="button" name="" id="addbtn" value="+ Add" class="product-add p-1 rounded px-3">
                  </div>
                </div>
              </div>
          </div>
        </div>
      </div>
      <!-- -------- -->
      </div>
    </div>
    </div>
