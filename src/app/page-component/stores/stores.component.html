<div class="container bg-white mt-2 py-3">
  <div class="row gap-md-4">
  <!-- single store -->
    <div class="col-12 col-md-6  single-store-div" *ngFor="let items of store_list">
      <div class="row justify-content-center p-md-2 single-store rounded-3">
        <div class="col-4  d-flex justify-content-center align-items-center ">
          <div class="store-img">
            <img class="rounded-3" src="{{items.shop_img}}" alt="">
          </div>
        </div>
        <div class="col-8 py-4 py-md-0 store-desc  p-0">
          <div class="p-1 ">
            <div class="">
          <h1 class="fs-4 fw-semibold ">{{items.shop_name}}</h1>
          <p class="text-xs ">{{items.shop_add}}</p>
        </div>

          <div class="mt-4 d-flex justify-content-between">
              <p class="fs-5">{{items.shop_type}}</p>
              <div class="close-store-icon" *ngIf="items.shop_status == 'close'">
              <img id="close-shop" class="" src="../../../assets/asserts/icons and vectors/closed.svg " alt="">
            </div>
            </div>
        </div>
      </div>
      </div>
    </div>
    <!-- single store -->
    </div>
  </div>
