<app-fav-store2-carousel></app-fav-store2-carousel>
<div class="container bg-white mt-2 py-3">
  <div class="row gap-md-4">
  <!-- single store -->
    <div class="col-12 col-lg-5 d-flex align-items-center p-0 p-3  shop-div" *ngFor="let items of store_list">
      <div class="col-4 ">
        <div class="store-img ">
          <img class="img-cover rounded" src="{{items.shop_img}}" alt="">
        </div>
      </div>
      <div class="col-8  h-100 d-flex flex-column justify-content-between">
        <div>
        <h5>{{items.shop_name}}</h5>
        <p>{{items.shop_add}}</p>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <p>{{items.shop_type}}</p>
        <img *ngIf="items.shop_status == 'close'" class="md-icon" src="../../../assets/asserts/icons and vectors/closed.svg" alt="">
      </div>
      </div>
    </div>
    <!-- single store -->
    </div>
  </div>
  <app-home-bottom-carousel></app-home-bottom-carousel>
